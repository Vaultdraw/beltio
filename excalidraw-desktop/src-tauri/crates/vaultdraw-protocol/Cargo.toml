[package]
name = "vaultdraw-protocol"
version = "0.2.0"
edition = "2021"
description = "Vaultdraw control API: JSON-RPC 2.0 types, NDJSON framing, paths and a blocking client"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: the control link is a named pipe (`\\.\pipe\vaultdraw-...`) through interprocess.
[target.'cfg(windows)'.dependencies]
interprocess = "2"

[dev-dependencies]
tempfile = "3"
