[package]
name = "vaultdraw-protocol"
version = "0.1.2"
edition = "2021"
description = "Vaultdraw control API: JSON-RPC 2.0 types, NDJSON framing, paths and a blocking client"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
