[package]
name = "excalidraw-vault"
version = "0.2.0"
description = "Vaultdraw: an offline, local-first vault for Excalidraw drawings"
authors = ["Vaultdraw contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "excalidraw_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
semver = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
notify = "6"
toml = "1"
toml_edit = "0.25"
rfd = "0.15"
trash = "5"
memchr = "2"
unicode-normalization = "0.1"
postcard = { version = "1", features = ["use-std"] }
crc32fast = "1"
vaultdraw-protocol = { path = "crates/vaultdraw-protocol" }
vaultdraw-core = { path = "crates/vaultdraw-core" }
libc = "0.2"
# File history (PLAN D-Z): level-3 frames, no default features (no legacy formats, no zdict builder).
zstd = { version = "0.13", default-features = false, features = ["thin"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
smoke-test = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSEvent"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFURL", "CFString", "CFNumber", "CFDictionary", "CFCGTypes", "CFBase"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGPDFDocument", "CGPDFPage", "CGPDFContext", "CGContext", "CGBitmapContext", "CGColorSpace", "CGImage", "CGDataProvider", "CGAffineTransform", "CGGeometry", "CGBase"] }
objc2-web-kit = { version = "0.3", features = ["WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore"] }

# Linux PDF import (pdf_import::linux): poppler-glib is loaded with dlopen at first use; the
# PNG and JPEG encoders are pure Rust (png is already in the tree through muda).
# Hang watchdog (`watchdog/linux.rs`): the same webkit2gtk/gtk/glib versions wry 0.57 already pulls in.
[target.'cfg(target_os = "linux")'.dependencies]
png = "0.18"
jpeg-encoder = "0.7"
webkit2gtk = "2.0"
gtk = "0.18"
glib = "0.18"

# Hardware SHA-256 on Apple Silicon / ARM (about 4x faster revision hashing of large drawings).
[target.'cfg(all(target_arch = "aarch64", target_vendor = "apple"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

# Control API (personal/feature/control-api): the protocol, headless core and `vaultdraw` CLI
# crates share this workspace, its Cargo.lock and target/.
[workspace]
members = [".", "crates/*"]

# vaultdraw-core holds the search/links hot paths moved out of the app crate (C4a);
# one codegen unit keeps their inlining as it was inside the app crate.
[profile.release.package.vaultdraw-core]
codegen-units = 1
