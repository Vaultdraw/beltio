<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vaultdraw (e2e)</title>
    <!-- Dev-only Playwright harness: real VaultApp over an in-memory vault. Not part of the Tauri build. -->
    <script>
      // The tests emulate Safari on macOS (Desktop Safari user agent) and press "Meta"
      // chords. Playwright WebKit on Linux still reports navigator.platform "Linux", so
      // Excalidraw would expect Ctrl; make it agree with the user agent.
      if (/Macintosh/.test(navigator.userAgent) && !/Mac/.test(navigator.platform)) {
        Object.defineProperty(navigator, "platform", { get: () => "MacIntel" });
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/e2e/harnessMain.tsx"></script>
  </body>
</html>
