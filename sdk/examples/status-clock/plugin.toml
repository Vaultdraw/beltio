id = "status-clock"
name = "Status clock"
version = "0.1.0"
api = 1
min_app = "0.1.2"
main = "main.js"
description = "Example: a status bar item with a click command"
author = "Vaultdraw"
activation = ["onStartupFinished"]

[[contributes.commands]]
id = "toggle-seconds"
title = "Clock: toggle seconds"

[[contributes.status_bar]]
id = "clock"
title = "Clock"
align = "right"
priority = 10
command = "toggle-seconds"
