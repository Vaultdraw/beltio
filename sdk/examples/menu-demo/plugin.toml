id = "menu-demo"
name = "Menu demo"
version = "0.1.0"
api = 1
min_app = "0.1.2"
main = "main.js"
description = "Example: context menu items for tree rows, tabs and the canvas"
author = "Vaultdraw"

[[contributes.commands]]
id = "where"
title = "Menu demo: where was I chosen?"

[[contributes.menus]]
surface = "tree"
command = "where"
title = "Where was I chosen?"
kinds = ["drawing", "note"]   # not for folders

[[contributes.menus]]
surface = "tab"
command = "where"

[[contributes.menus]]
surface = "canvas"
command = "where"
