id = "pdf-import"
name = "PDF import"
version = "0.1.0"
api = 1
min_app = "0.2.0"
main = "main.js"
description = "Import the pages of a PDF as pictures in the open drawing"
author = "Vaultdraw"
permissions = ["pdf"]

[[contributes.importers]]
id = "pdf"
title = "PDF"
extensions = ["pdf"]

[[contributes.commands]]
id = "import"
title = "Import: PDF…"
when = ["drawingOpen", "writable"]
