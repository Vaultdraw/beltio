# Linux checks on GitHub's ubuntu runners. Four jobs run side by side so one slow part
# does not hold the others: typecheck + unit tests, Rust tests, the functional end-to-end
# suite (Playwright WebKit under Xvfb, three shards), and a bundle smoke (deb, AppImage).
# Written 2026-10-27, reworked 2026-10-30 after a triage run (personal/feature/linux-ci-triage/TRIAGE.md).
# Enabling it (pushing this file to main) is an owner action.
name: linux
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "linux-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

env:
  CI: "1"
  # Keep Tauri's Linux packages in one place so the jobs that build the app stay identical.
  TAURI_LIBS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
    libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils desktop-file-utils

jobs:
  check:
    name: typecheck + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn, cache-dependency-path: yarn.lock }
      - run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - run: npx --yes yarn@1.22.22 test:typecheck
      - name: Lint (desktop, sdk)
        run: |
          npx eslint --max-warnings=0 --ext .js,.ts,.tsx excalidraw-desktop
          npx eslint --max-warnings=0 --ext .js,.ts,.tsx,.mjs,.cjs sdk
      - name: Node tests (scripts, perf library)
        run: node --test excalidraw-desktop/perf/lib/*.test.mjs excalidraw-desktop/scripts/*.test.mjs
      - name: Unit tests (desktop, sdk examples, editor packages)
        run: |
          (cd excalidraw-desktop && npx vitest run --maxWorkers=2 --minWorkers=1)
          npx vitest run sdk --maxWorkers=2 --minWorkers=1
          VAULTDRAW_TEST_HOST=mock npx vitest run sdk/examples --maxWorkers=2 --minWorkers=1
          npx vitest run packages --maxWorkers=2 --minWorkers=1

  rust:
    name: cargo test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: excalidraw-desktop/src-tauri, cache-on-failure: true }
      - name: System libraries for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LIBS
      - name: cargo test --workspace
        run: cargo test --workspace -j 2 --manifest-path excalidraw-desktop/src-tauri/Cargo.toml

  e2e:
    name: end-to-end (WebKit, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    defaults: { run: { working-directory: excalidraw-desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn, cache-dependency-path: yarn.lock }
      - run: npx --yes yarn@1.22.22 install --frozen-lockfile
        working-directory: .
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "playwright-webkit-${{ steps.pw.outputs.version }}" }
      - name: WebKit and its system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install --with-deps webkit
      # The shards split the spec files evenly. A failed test is retried once (reported as flaky, not
      # hidden); the timeout factor leaves room for the software-rendered display on a shared runner.
      - name: Functional end-to-end suite
        run: xvfb-run -a -s "-screen 0 1280x850x24" npx playwright test --shard=${{ matrix.shard }}/3 --retries=1
        env: { E2E_WORKERS: "2", E2E_TIMEOUT_FACTOR: "1.5" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: .cache/e2e-results-*
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    name: bundle (deb, AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults: { run: { working-directory: excalidraw-desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn, cache-dependency-path: yarn.lock }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: excalidraw-desktop/src-tauri, cache-on-failure: true }
      - name: System libraries for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_LIBS
      - run: npx --yes yarn@1.22.22 install --frozen-lockfile
        working-directory: .
      # linuxdeploy and its plugins are AppImages that the bundler downloads from GitHub.
      - name: Build the bundles
        run: npx --yes yarn@1.22.22 tauri build --ci
        env: { APPIMAGE_EXTRACT_AND_RUN: "1", NO_STRIP: "1" }
      - run: desktop-file-validate src-tauri/linux/vaultdraw.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            excalidraw-desktop/src-tauri/target/release/bundle/deb/*.deb
            excalidraw-desktop/src-tauri/target/release/bundle/rpm/*.rpm
            excalidraw-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
